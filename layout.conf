# MeowSynth for MPC OS: the original panel, widened to the MPC page (1280x800 canvas; the plugin area is
# y=86..714, so y here = tools/meow_art.py's page y + 86). The page art carries panels and lettering;
# these lines only place the live controls on it.
theme_bg=2f5568
theme_ink=ffffff
theme_ink_dim=ffffff
theme_accent=ffffff
theme_accent_hi=ffe400
theme_lcd=10222a
theme_line=9ec0cf
theme_seg_active=ffe400
theme_seg_inactive=7e8488
theme_seg_active_tx=181818
art_css=skin.css
knob_strip=images/knob_strip.png
knob_frames=64
# Q-Links when MPC is not following the screen: the panel, then the heart of the meow filter
qlinks_track = env_m,env_e,env_o,env_w,vib_amt,vib_atk,vib_speed,preset,porta,noise,chorus,bend,polycat,cutoff,reso,envmod

[tab MEOW]
art file=images/bg_meow.png fit=stretch
picture x=40 y=112 w=400 h=300 key=meow files="images/cat_00.png,images/cat_01.png,images/cat_02.png,images/cat_03.png,images/cat_04.png,images/cat_05.png,images/cat_06.png,images/cat_07.png,images/cat_08.png,images/cat_09.png,images/cat_10.png,images/cat_11.png"
enum_h cx=240 cy=544 key=preset options="CLEAR CAT,OLD CAT,MARCH CAT,CATBAND,GOSPEL CATS" sw=136 rows=2
knob cx=580 cy=196 r=40 key=env_m
knob cx=773 cy=196 r=40 key=env_e
knob cx=966 cy=196 r=40 key=env_o
knob cx=1159 cy=196 r=40 key=env_w
knob cx=580 cy=376 r=40 key=vib_amt
knob cx=773 cy=376 r=40 key=vib_atk
popup cx=1062 cy=376 w=240 h=64 key=vib_speed
knob cx=580 cy=556 r=40 key=porta
knob cx=773 cy=556 r=40 key=noise
knob cx=966 cy=556 r=40 key=chorus
knob cx=1159 cy=556 r=40 key=bend strip=images/bend_strip.png frames=12
toggle cx=1073 cy=670 w=366 h=48 key=polycat img=images/polycat_off.png img_on=images/polycat_on.png
# on a 4-knob MPC each group of four is one Q-Link bank: the envelope, vibrato + cat, the bottom row
qlinks "MEOW" = env_m,env_e,env_o,env_w,vib_amt,vib_atk,vib_speed,preset,porta,noise,chorus,bend,polycat

[tab FILTER]
art file=images/bg_filter.png fit=stretch
picture x=40 y=112 w=400 h=300 key=meow files="images/cat_00.png,images/cat_01.png,images/cat_02.png,images/cat_03.png,images/cat_04.png,images/cat_05.png,images/cat_06.png,images/cat_07.png,images/cat_08.png,images/cat_09.png,images/cat_10.png,images/cat_11.png"
enum_h cx=240 cy=544 key=preset options="CLEAR CAT,OLD CAT,MARCH CAT,CATBAND,GOSPEL CATS" sw=136 rows=2
knob cx=580 cy=196 r=40 key=cutoff
knob cx=773 cy=196 r=40 key=reso
knob cx=966 cy=196 r=40 key=envmod
knob cx=1159 cy=196 r=40 key=fmix
knob cx=580 cy=376 r=40 key=fol_atk
knob cx=773 cy=376 r=40 key=fol_dec
knob cx=1159 cy=376 r=40 key=gain
enum_h cx=870 cy=556 key=ftype options="LP,HP,BP1,BP2,NOTCH" sw=140
toggle cx=1073 cy=670 w=366 h=48 key=polycat img=images/polycat_off.png img_on=images/polycat_on.png
qlinks "FILTER" = cutoff,reso,envmod,fmix,fol_atk,fol_dec,gain,ftype
